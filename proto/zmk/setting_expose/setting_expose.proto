syntax = "proto3";

package zmk.setting_expose;

// A single setting key/value pair with type-safe value via oneof.
message SettingEntry {
    string key = 1;
    oneof typed_value {
        bytes bytes_value = 2;
        int32 int32_value = 3;
        bool bool_value = 4;
        string string_value = 5;
    }
}

// List persisted settings.
//
// Results are paginated so that a device with many settings does not have to
// stream one huge response (which is slow over the RPC transport and can make
// the client time out). The client fetches successive pages until has_more is
// false.
message ListRequest {
    uint32 offset = 1; // index of the first entry to return (0-based)
    uint32 limit = 2;  // max entries to return; 0 means "all remaining"
}

message ListResponse {
    repeated SettingEntry entries = 1;
    uint32 next_offset = 2; // offset to pass in the next ListRequest
    bool has_more = 3;      // true if more entries remain beyond this page
}

// Read a single setting by key.
message ReadRequest { string key = 1; }

message ReadResponse {
    string key = 1;
    oneof typed_value {
        bytes bytes_value = 2;
        int32 int32_value = 3;
        bool bool_value = 4;
        string string_value = 5;
    }
}

// Write (persist) a setting value.
message WriteRequest {
    string key = 1;
    oneof typed_value {
        bytes bytes_value = 2;
        int32 int32_value = 3;
        bool bool_value = 4;
        string string_value = 5;
    }
}

message WriteResponse {}

// Delete (reset) a setting by key.
message DeleteRequest { string key = 1; }

message DeleteResponse {}

// Query the settings storage backend capacity.
message StorageInfoRequest {}

message StorageInfoResponse {
    uint32 total_bytes = 1;   // 0 if unknown
    uint32 free_bytes = 2;    // 0 if unknown
    uint32 used_bytes = 3;    // 0 if unknown
    uint32 garbage_bytes = 4; // NVS stale-ATE estimate; 0 if not available
}

// Trigger garbage collection / compaction of the settings storage backend.
message GcRequest {}

message GcResponse {}

// Delete ALL persisted settings. The web UI must show a confirmation dialog.
message ClearAllRequest {}

message ClearAllResponse {}

message ErrorResponse { string message = 1; }

// Immediate acknowledgement returned by the central for a targeted request
// (target != TARGET_CENTRAL). The actual per-half result(s) arrive later as
// Notification messages -- see the `target` field on Request.
message AckResponse {}

// Which half of a split keyboard a request addresses. `target` on Request:
//   TARGET_CENTRAL (0) -- the central half only. Handled synchronously; the
//                         result is returned in this call's Response. Default,
//                         and the only path on a non-split keyboard.
//   1 .. 0xFFFE        -- a specific peripheral by 1-based source index. The
//                         central broadcasts the request to every peripheral
//                         (ZMK's relay cannot address one), runs it there, and
//                         forwards only the reply whose source matches as a
//                         Notification.
//   TARGET_ALL (0xFFFF)-- every half (central + all peripherals). Each half's
//                         result arrives as its own Notification (central's as
//                         source 0). A delete/clear_all with TARGET_ALL deletes
//                         the peripherals first and the central last, then
//                         emits a Notification with complete=true.
enum Target {
    TARGET_CENTRAL = 0;
    TARGET_ALL = 0xFFFF;
}

message Request {
    // Split-keyboard target (see Target). Absent/0 == TARGET_CENTRAL.
    uint32 target = 8;
    // Client-chosen id echoed back in every Notification produced for this
    // request, so the client can correlate/ignore stale asynchronous replies.
    uint32 req_id = 9;
    oneof request_type {
        ListRequest list = 1;
        ReadRequest read = 2;
        WriteRequest write = 3;
        DeleteRequest delete = 4;
        StorageInfoRequest storage_info = 5;
        GcRequest gc = 6;
        ClearAllRequest clear_all = 7;
    }
}

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        ListResponse list = 2;
        ReadResponse read = 3;
        WriteResponse write = 4;
        DeleteResponse delete = 5;
        StorageInfoResponse storage_info = 6;
        GcResponse gc = 7;
        ClearAllResponse clear_all = 8;
        AckResponse ack = 9;
    }
}

// End-of-stream marker for a `list` answered over notifications: the half
// identified by `source` has sent every SettingEntry it holds.
message ListDone {}

// A TARGET_ALL delete/clear_all has finished: the central deleted the
// peripherals first and its own store last.
message Complete {}

// Firmware-initiated notification carrying one half's answer to a targeted
// request. `source` is 0 for the central and the 1-based index for a
// peripheral; `req_id` echoes the triggering Request. The `event` is type-safe
// (no opaque bytes):
//   - a `list` streams one `entry` per notification (to keep peripheral memory
//     tiny -- there is no per-page buffer), terminated by `list_done`;
//   - every other operation returns a single `response`;
//   - a TARGET_ALL delete/clear_all ends with `complete`.
message Notification {
    uint32 source = 1;
    uint32 req_id = 2;
    oneof event {
        SettingEntry entry = 3;
        ListDone list_done = 4;
        Response response = 5;
        Complete complete = 6;
    }
}
